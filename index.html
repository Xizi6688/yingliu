<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daohang 官方帮助中心 - 协作文档</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold">📖</div>
                <span class="font-bold text-lg text-slate-900">Daohang 官方知识库</span>
            </div>
            <!-- 作者专属管理后台入口 -->
            <a href="/admin/" target="_blank" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white hover:bg-blue-600 transition shadow-sm">
                ⚙️ 作者登录后台
            </a>
        </div>
    </header>

    <!-- 主体公开浏览区 -->
    <main class="max-w-4xl mx-auto px-6 py-12 flex-1 w-full space-y-8">
        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h1 class="text-3xl font-black text-slate-900">欢迎访问公开文档中心</h1>
            <p class="text-slate-600 leading-relaxed">这里是面向所有访客的只读知识库。所有内容均由作者在后台通过 Markdown 实时维护，全球 CDN 加速发布。</p>
        </div>

        <!-- 文章列表区 -->
        <div class="space-y-4">
            <h2 class="text-xl font-bold text-slate-900">📑 最新公开文档</h2>
            <div id="article-list" class="grid gap-4">
                <!-- 动态读取 -->
                <div class="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:border-blue-500 transition cursor-pointer">
                    <h3 class="font-bold text-lg text-slate-900 mb-1">🚀 示例：如何使用本系统</h3>
                    <p class="text-xs text-slate-500">发布于 2026-03-30 · 点击进入阅读正文</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-400 bg-white">
        <p>© 2026 Daohang. Powered by Decap CMS & Cloudflare Pages.</p>
    </footer>
</body>
</html>
