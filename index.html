<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Daohang 智能协作文档</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 引入飞书/Vue 官方风格的暗黑美学主题 -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <style>
        :root {
            --theme-color: #0080ff; /* 飞书蓝 */
            --base-font-size: 16px;
        }
        .markdown-section { max-width: 900px !important; }
        /* 侧边栏飞书风格微调 */
        .sidebar { background-color: #f8fafc; border-right: 1px solid #e2e8f0; }
        .sidebar h1 a { font-weight: 700; color: #1e293b; }
    </style>
</head>
<body>
    <div id="app">正在加载飞书风格工作台...</div>
    <script>
        window.$docsify = {
            name: '📂 Daohang 协作文档',
            repo: 'https://github.com',
            loadSidebar: true,      // 开启左侧树状目录
            subMaxLevel: 3,         // 目录嵌套深度
            auto2top: true,         // 切换页面自动回到顶部
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: '搜索文档、标题或关键字...',
                noData: '没有找到相关内容!',
                depth: 6,
            }
        }
    </script>
    <!-- 核心渲染与搜索插件 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
